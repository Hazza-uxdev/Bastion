<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: dark;
    --bg: #111111;
    --panel: #181818;
    --panel-2: #202020;
    --border: #303030;
    --text: #f1f1f1;
    --muted: #8d8d8d;
    --accent: #7c3aed;
    --ok: #4ade80;
    --warn: #facc15;
    --err: #fb7185;
  }

  * { box-sizing: border-box; }

  body {
    width: 340px;
    margin: 0;
    background:
      radial-gradient(circle at 20% 0%, rgba(124, 58, 237, 0.18), transparent 34%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  .shell { padding: 12px; }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .logo {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #06b6d4);
    color: white;
    font-weight: 800;
    box-shadow: 0 10px 24px rgba(124, 58, 237, 0.28);
  }

  h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
  }

  .version {
    color: var(--muted);
    font-size: 11px;
    margin-top: 1px;
  }

  .status,
  .panel {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(24, 24, 24, 0.94);
  }

  .status-top {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 7px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 99px;
    background: var(--warn);
    box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.12);
  }

  .status.ok .dot {
    background: var(--ok);
    box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.12);
  }

  .status.err .dot {
    background: var(--err);
    box-shadow: 0 0 0 4px rgba(251, 113, 133, 0.12);
  }

  .status-title {
    font-size: 13px;
    font-weight: 650;
  }

  .status-copy,
  .muted {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }

  .panel {
    margin-top: 10px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  input[type="search"] {
    width: 100%;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
    color: var(--text);
    font: 12px "Segoe UI", system-ui, sans-serif;
    padding: 0 10px;
    outline: none;
  }

  input[type="search"]:focus {
    border-color: var(--accent);
  }

  button {
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
    color: var(--text);
    font: 600 12px "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
    padding: 0 11px;
  }

  button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: white;
  }

  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: 0.55; cursor: default; }

  .credentials {
    display: grid;
    gap: 7px;
    margin-top: 9px;
    max-height: 210px;
    overflow: auto;
  }

  .entry {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 9px;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    background: #171717;
  }

  .entry-title {
    font-size: 12px;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-sub {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .footer {
    margin-top: 11px;
    color: #6f6f6f;
    font-size: 11px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div class="logo">B</div>
      <div>
        <h1>Bastion Autofill</h1>
        <div class="version">Extension v1.0.5</div>
      </div>
    </div>

    <div class="status" id="status">
      <div class="status-top">
        <div class="dot"></div>
        <div class="status-title" id="statusTitle">Checking Bastion</div>
      </div>
      <div class="status-copy" id="statusCopy">Looking for the local vault bridge...</div>
    </div>

    <div class="panel">
      <div class="row">
        <div>
          <div class="status-title" id="siteTitle">Current site</div>
          <div class="muted" id="siteHost">Loading...</div>
        </div>
        <button id="togglePrompts">Loading</button>
      </div>
    </div>

    <div class="panel">
      <div class="row" style="margin-bottom:8px;">
        <input type="search" id="search" placeholder="Search saved logins">
        <button class="primary" id="refresh">Refresh</button>
      </div>
      <div class="credentials" id="credentials"></div>
    </div>

    <div class="footer">Autofill only works while the Bastion desktop vault is unlocked. Save prompts can be disabled per site.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
